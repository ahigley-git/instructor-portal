<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ResQ Instructor Portal</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1C1C1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ResQ Instructors">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/*BASE_CSS*/
  /* Instructor portal additions */
  .pill.Approved,.pill.Paid,.pill.Open{background:var(--ok-soft);color:var(--ok)}
  .pill.Waitlist,.pill.Upcoming{background:#E7ECF5;color:#3E5B8A}
  .pill.Drop,.pill.Declined,.pill.Owed{background:var(--ember-soft);color:var(--ember)}
  .pill.Dropped,.pill.Inactive,.pill.Hidden,.pill.Closed,.pill.Cancelled{background:#EEE;color:#888}
  .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;margin:4px 0 2px}
  .checks label{display:flex;gap:8px;align-items:flex-start;font-weight:500;font-size:14px;margin:0;cursor:pointer}
  .checks input{margin-top:3px}
  .signup-link{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--slate)}
  .day{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .day-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 18px;background:#FAFAFB;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .day-h .t{font-weight:800}
  .day-h .s{font-size:13px;color:var(--slate)}
  .blk{padding:10px 18px 12px;border-top:1px solid var(--line)}
  .blk:first-of-type{border-top:0}
  .blk-h{display:flex;gap:10px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap}
  .blk-h .b{font-family:"Courier New",monospace;font-weight:700;font-size:12px;letter-spacing:1.5px;color:#fff;background:var(--ink);padding:2px 7px;border-radius:4px}
  .blk-h .tp{font-size:14px;color:var(--slate)}
  .slot{display:grid;grid-template-columns:minmax(150px,1.2fr) 110px 120px minmax(120px,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}
  .slot:first-of-type{border-top:0}
  .slot .r{font-weight:700}
  .slot .n{font-size:12.5px;color:var(--slate);margin-top:2px}
  .slot .tm{font-family:"Courier New",monospace;font-size:13px}
  .slot .op{font-size:13px}
  .slot .op b{font-size:14px}
  .slot .act{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  @media(max-width:760px){.slot{grid-template-columns:1fr 1fr}.slot .act{grid-column:1/-1;justify-content:flex-start}}
  .muted{color:var(--slate)} .small{font-size:13px}
  .warnbox{background:var(--warn-soft);color:#6b4510;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14px}
  .okbox{background:var(--ok-soft);color:#1f5a3c;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14px}
  .inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}
  .inline-form input,.inline-form select{width:auto;padding:7px 9px;font-size:13px}
  .inline-form label{font-size:12px;margin-bottom:3px}
  .row-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  details.sess{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
  details.sess>summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
  details.sess>summary::-webkit-details-marker{display:none}
  details.sess>summary .sum-r{margin-left:auto;font-size:13px;color:var(--slate)}
  details.sess[open]>summary{border-bottom:1px solid var(--line);background:#FAFAFB}
  .sess-body{padding:12px 14px}
  .ed{width:100%;padding:6px 8px!important;font-size:13px!important;border:1px solid var(--line);border-radius:6px}
  td .ed{min-width:0}
  .people{font-size:12.5px;color:var(--slate);margin-top:3px}
  .people .pp{display:inline-flex;gap:4px;align-items:center;margin-right:8px}
  .cnt{display:inline-block;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--ember);color:#fff;font-size:12px;font-weight:800;margin-left:6px;text-align:center}
  .tab .cnt{margin-left:4px}
  .ins-card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff}
  .ins-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
  .ins-top .t{font-weight:700;font-size:16px}
  .demo-bar{background:var(--warn);color:#fff;text-align:center;font-size:13px;padding:6px 10px}
  .demo-bar button{background:#fff;color:var(--warn);border:0;border-radius:5px;padding:3px 8px;font-weight:700;margin-left:8px;cursor:pointer}
  .switch{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .switch:first-child{border-top:0}
  .switch input{width:18px;height:18px}
  .switch .d{font-size:13px;color:var(--slate)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--slate);margin:-6px 0 14px}
</style>
</head>
<body>
<!--DEMO_BAR-->
<div id="login" class="login-wrap hidden">
  <div class="login">
    <div class="login-top">
      <div class="eyebrow">ResQ Education</div>
      <h1>Instructor <span>Portal</span></h1>
    </div>
    <div class="login-body">
      <div id="step-email">
        <p>Log in with your email. We'll send you a 6-digit code.</p>
        <form id="form-email">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
          <div style="height:14px"></div>
          <button class="btn block" id="btn-send" type="submit">Send my code</button>
        </form>
        <div class="signup-link">New to teaching with ResQ? <button class="linkbtn" id="btn-show-signup" type="button">Create an instructor account</button></div>
      </div>
      <div id="step-signup" class="hidden">
        <p>Tell us about yourself. You can hold class slots right away; ResQ reviews your account and certifications before approving them.</p>
        <form id="form-signup">
          <div class="form-grid">
            <div class="full"><label for="su-name">Full name</label><input id="su-name" type="text" autocomplete="name" required></div>
            <div><label for="su-email">Email</label><input id="su-email" type="email" autocomplete="email" required></div>
            <div><label for="su-phone">Mobile phone</label><input id="su-phone" type="tel" autocomplete="tel" required></div>
            <div class="full"><label>Certifications you hold</label><div class="checks" id="su-creds"></div></div>
            <div class="full"><label for="su-about">Experience (optional)</label><textarea id="su-about" placeholder="Agency, years in EMS, teaching experience, roles you're interested in"></textarea></div>
          </div>
          <div style="height:14px"></div>
          <button class="btn block" id="btn-signup" type="submit">Create account and send my code</button>
        </form>
        <div style="margin-top:14px;font-size:14px"><button class="linkbtn" id="btn-signup-back" type="button">Back to log in</button></div>
      </div>
      <div id="step-code" class="hidden">
        <p id="code-text"></p>
        <form id="form-code">
          <label for="code">Login code</label>
          <input id="code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required placeholder="------">
          <div style="height:14px"></div>
          <button class="btn block" id="btn-verify" type="submit">Log in</button>
        </form>
        <div style="margin-top:14px;font-size:14px;display:flex;justify-content:space-between">
          <button class="linkbtn" id="btn-back" type="button">Use a different email</button>
          <button class="linkbtn" id="btn-resend" type="button">Send a new code</button>
        </div>
      </div>
      <div id="login-msg" class="msg"></div>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="bar">
    <div class="bar-in">
      <div class="brand">ResQ <span>Instructors</span></div>
      <div class="who"><span id="who-name"></span><button id="btn-logout" type="button">Log out</button></div>
    </div>
    <nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
  </header>
  <main id="view"><div class="loading"><div class="spinner"></div>Loading…</div></main>
</div>
<div id="toast" class="toast"></div>

<script>
/*DEMO_SCRIPT*/
(function(){
  'use strict';
  var TOKEN_KEY = 'resq_ins_token';
  var memToken = null;
  var CREDS = ['EMR','EMT','AEMT','Paramedic','RN','Physician / PA / NP','AHA BLS Instructor','AHA ACLS/PALS Instructor','EMT Instructor (MN OEMS)','Psychomotor evaluator','Firefighter','Student / pre-health (patient role)','Other'];
  var S = { data:null, tab:'slots', course:null, role:'All', onlyOpen:false, mineFilter:'Upcoming', payFilter:'Owed', payCourse:'All',
    bCourse:null, openSess:{}, insSearch:'', insFilter:'All', dropFor:null, assignFor:null, insOpen:{} };

  function getToken(){ try{ return localStorage.getItem(TOKEN_KEY) || memToken; }catch(e){ return memToken; } }
  function setToken(t){ memToken = t; try{ if(t) localStorage.setItem(TOKEN_KEY,t); else localStorage.removeItem(TOKEN_KEY); }catch(e){} }

  function api(fn){
    var args = Array.prototype.slice.call(arguments,1);
    if (window.__DEMO_API) return window.__DEMO_API(fn,args);
    return fetch('/api/'+fn,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({args:args})})
      .then(function(r){ return r.json().catch(function(){ return {ok:false,error:'Connection problem. Try again.'}; }); },
            function(){ return {ok:false,error:'Connection problem. Check your internet and try again.'}; })
      .then(function(res){
        if(res && res.ok) return res.data;
        var err = new Error(res && res.error || 'Something went wrong.'); err.session = res && res.session; throw err;
      });
  }
  function authed(fn){
    var args = Array.prototype.slice.call(arguments,1);
    return api.apply(null,[fn,getToken()].concat(args)).catch(function(e){
      if(e.session){ setToken(null); showLogin('Your session ended. Log in again.'); }
      throw e;
    });
  }

  // ---------- helpers ----------
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function money(n){ n=Number(n)||0; return '$'+n.toLocaleString('en-US',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2}); }
  function payText(n){ return Number(n)>0 ? money(n) : '<span class="muted">Pay TBD</span>'; }
  function tm(t){ return esc(t||''); }
  function pill(s,label){ return '<span class="pill '+esc(String(s||'').split(' ')[0].replace(/[^A-Za-z]/g,''))+'">'+esc(label||s)+'</span>'; }
  function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},2800); }
  function busy(btn,on,label){ if(!btn) return; if(on){ btn.dataset.l=btn.textContent; btn.textContent=label||'Working…'; btn.disabled=true; } else { btn.textContent=btn.dataset.l||btn.textContent; btn.disabled=false; } }
  function val(id){ var e=$(id); return e ? e.value : ''; }
  function chips(name, options, current){
    return '<div class="filters">'+options.map(function(o){ var v=Array.isArray(o)?o[0]:o, l=Array.isArray(o)?o[1]:o;
      return '<button class="chip'+(String(v)===String(current)?' on':'')+'" data-act="chip" data-k="'+name+'" data-v="'+esc(v)+'">'+esc(l)+'</button>'; }).join('')+'</div>';
  }
  function credChecks(prefix, selected){
    selected = selected||[];
    return CREDS.map(function(c,i){ return '<label><input type="checkbox" class="'+prefix+'" value="'+esc(c)+'"'+(selected.indexOf(c)>=0?' checked':'')+'> '+esc(c)+'</label>'; }).join('');
  }
  function checked(cls){ return Array.prototype.slice.call(document.querySelectorAll('.'+cls+':checked')).map(function(e){ return e.value; }); }
  function stateOf(r){ return r.status==='Approved' && r.pay ? r.pay : r.status; }

  // ---------- login ----------
  function showLogin(msg){
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    step('email'); setMsg(msg||'', msg?'err':'');
  }
  function step(n){ ['email','signup','code'].forEach(function(s){ $('step-'+s).classList.toggle('hidden', s!==n); }); }
  function setMsg(t,cls){ var m=$('login-msg'); m.textContent=t; m.className='msg '+(cls||''); }
  var pendingEmail='';
  function toCode(email, text){ pendingEmail=email; $('code-text').innerHTML=text; step('code'); $('code').value=''; $('code').focus(); }
  function sendCode(e){
    if(e) e.preventDefault();
    var email=$('email').value.trim(); if(!email) return;
    var btn=$('btn-send'); busy(btn,true,'Sending…'); setMsg('');
    api('apiRequestCode',email).then(function(r){
      if(r && r.unknown){ setMsg('We don\'t have an instructor account for '+email+'. Create one below.','err'); $('su-email').value=email; step('signup'); return; }
      toCode(email,'A code is on its way to <b>'+esc(email)+'</b>. Check your inbox (and spam).');
    }).catch(function(err){ setMsg(err.message,'err'); }).then(function(){ busy(btn,false); });
  }
  function signup(e){
    e.preventDefault();
    var btn=$('btn-signup'); busy(btn,true,'Creating…'); setMsg('');
    var p={ name:val('su-name'), email:val('su-email'), phone:val('su-phone'), about:val('su-about'), credentials:checked('su-cred') };
    api('apiSignup',p).then(function(r){
      toCode(p.email.trim(), (r.existing?'You already have an account, so we just sent a login code':'Account created. We sent a login code')+' to <b>'+esc(p.email.trim())+'</b>.');
    }).catch(function(err){ setMsg(err.message,'err'); }).then(function(){ busy(btn,false); });
  }
  function verify(e){
    e.preventDefault();
    var btn=$('btn-verify'); busy(btn,true,'Checking…'); setMsg('');
    api('apiVerifyCode',pendingEmail,$('code').value).then(function(r){ setToken(r.token); start(); })
      .catch(function(err){ setMsg(err.message,'err'); }).then(function(){ busy(btn,false); });
  }

  // ---------- app ----------
  function start(){
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('view').innerHTML='<div class="loading"><div class="spinner"></div>Loading…</div>';
    return refresh(true);
  }
  function refresh(first){
    return authed('apiGetData').then(function(d){
      S.data=d;
      if(first){
        if(!d.me.isInstructor && d.me.isAdmin) S.tab='approvals';
        var openC = d.courses.filter(function(c){ return c.sessions.length; });
        S.course = (openC[0]||d.courses[0]||{}).id || null;
        S.bCourse = S.course;
      }
      $('who-name').textContent = d.me.name + (d.me.isAdmin ? ' · Admin' : '');
      render();
    }).catch(function(e){ if(!e.session) $('view').innerHTML='<div class="card"><p>'+esc(e.message)+'</p><button class="btn" data-act="retry">Try again</button></div>'; });
  }
  function adminCounts(){
    var a=S.data.admin; if(!a) return {};
    return { accounts:a.instructors.filter(function(i){return i.status==='Pending';}).length,
      requests:a.requests.filter(function(r){return r.status==='Pending' && !r.past;}).length,
      drops:a.requests.filter(function(r){return r.status==='Drop requested';}).length,
      owed:a.requests.filter(function(r){return r.pay==='Owed';}).length };
  }
  function render(){
    var d=S.data, tabs=[];
    if(d.me.isInstructor){ tabs.push(['slots','Open slots'],['mine','My schedule'],['earn','Earnings'],['profile','Profile & certs']); }
    else tabs.push(['slots','Course overview']);
    if(d.me.isAdmin){ var c=adminCounts(); tabs.push(['approvals','Approvals',(c.accounts+c.requests+c.drops)],['instructors','Instructors'],['builder','Schedule builder'],['payments','Payments',c.owed],['settings','Settings']); }
    if(!tabs.some(function(t){return t[0]===S.tab;})) S.tab=tabs[0][0];
    $('tabs').innerHTML = tabs.map(function(t){ return '<button class="tab'+(S.tab===t[0]?' on':'')+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+(t[2]?'<span class="cnt">'+t[2]+'</span>':'')+'</button>'; }).join('');
    var y=window.scrollY;
    $('view').innerHTML = ({slots:vSlots,mine:vMine,earn:vEarn,profile:vProfile,approvals:vApprovals,instructors:vInstructors,builder:vBuilder,payments:vPayments,settings:vSettings}[S.tab])();
    window.scrollTo(0,y);
  }

  // ---------- Open slots ----------
  function vSlots(){
    var d=S.data, me=d.me, out='';
    out+='<h2>'+(me.isInstructor?'Open slots':'Course overview')+'</h2><p class="sub">Pick the blocks you can teach. Your request holds the spot until a ResQ admin approves it. If a slot is full, you join the waitlist and move up automatically.</p>';
    if(me.isInstructor && me.status==='Pending') out+='<div class="warnbox"><b>Your account is under review.</b> You can request slots now and they\'ll be held for you. ResQ will check your certifications, then approve your account and your slots.</div>';
    if(!d.courses.length) return out+'<div class="card"><p class="empty">No courses are open for sign-up right now.</p></div>';
    var course = d.courses.filter(function(c){return c.id===S.course;})[0] || d.courses[0];
    var roles = ['All'].concat(d.config.roles.filter(function(r){return r.active;}).map(function(r){return r.name;}));
    out+='<div class="toolbar">'+chips('course', d.courses.map(function(c){return [c.id, c.name.replace('Accelerated EMT — ','EMT ')+(c.status!=='Open'?' ('+c.status+')':'')];}), course.id)+
      '<label class="small" style="display:flex;gap:6px;align-items:center;margin:0;font-weight:600"><input type="checkbox" data-act="onlyOpen"'+(S.onlyOpen?' checked':'')+'> Only show slots with openings</label></div>';
    out+='<div class="toolbar">'+chips('role', roles, S.role)+'</div>';
    if(course.description) out+='<p class="small muted" style="margin:-4px 0 14px">'+esc(course.location)+(course.location?' · ':'')+esc(course.description)+'</p>';
    var byDay={}, order=[];
    course.sessions.forEach(function(s){ if(s.past && !me.isAdmin) return; var k=s.date; if(!byDay[k]){ byDay[k]=[]; order.push(k); } byDay[k].push(s); });
    var shown=0;
    order.forEach(function(k){
      var sess=byDay[k], blocks='';
      sess.forEach(function(s){
        var slots=s.slots.filter(function(sl){ return (S.role==='All'||sl.role===S.role) && (!S.onlyOpen || sl.held<sl.openings || sl.mine) && (me.isAdmin || sl.status==='Open'); });
        if(!slots.length) return;
        blocks+='<div class="blk"><div class="blk-h"><span class="b">'+esc(s.block||'')+'</span><b class="tm">'+tm(s.start)+'–'+tm(s.end)+'</b><span class="tp">'+esc(s.topic)+'</span>'+(s.status!=='Open'?pill(s.status):'')+'</div>'+
          slots.map(function(sl){ return slotRow(sl,s); }).join('')+'</div>';
      });
      if(!blocks) return; shown++;
      out+='<div class="day"><div class="day-h"><span class="t">Day '+esc(sess[0].day)+' · '+esc(sess[0].dateText)+'</span><span class="s">'+esc(course.name)+'</span></div>'+blocks+'</div>';
    });
    if(!shown) out+='<div class="card"><p class="empty">Nothing matches these filters.</p></div>';
    return out;
  }
  function slotRow(sl,s){
    var me=S.data.me, left=sl.openings-sl.held, act='';
    var role=S.data.config.roles.filter(function(r){return r.name===sl.role;})[0]||{};
    if(sl.mine){
      act=sl.mine.status==='Waitlist' ? pill('Waitlist','Waitlist #'+sl.mine.position) : pill(sl.mine.status);
      act+=' <button class="btn ghost small" data-act="gomine">Manage</button>';
    } else if(me.isInstructor && !s.past && sl.status==='Open' && s.status==='Open'){
      act='<button class="btn small'+(left>0?'':' dark')+'" data-act="request" data-id="'+esc(sl.id)+'">'+(left>0?'Request':'Join waitlist')+'</button>';
    }
    var fill = left>0 ? '<b>'+left+'</b> of '+sl.openings+' open' : '<b>Full</b>'+(sl.waitlist?' · '+sl.waitlist+' waiting':'');
    var warn = me.isInstructor && me.status==='Approved' && !sl.qualified && !sl.mine ? '<div class="n" style="color:var(--warn)">You\'re not cleared for this role yet. You can still request it and ResQ will review.</div>' : '';
    var people = sl.people && sl.people.length ? '<div class="people">'+sl.people.map(function(p){ return '<span class="pp">'+esc(p.name)+' '+pill(p.status, p.status==='Waitlist'?'WL':p.status)+'</span>'; }).join('')+'</div>' : '';
    return '<div class="slot"><div><div class="r">'+esc(sl.role)+(sl.status!=='Open'?' '+pill(sl.status):'')+'</div>'+(sl.notes?'<div class="n">'+esc(sl.notes)+'</div>':'')+
      (role.requirements?'<div class="n"><i>Requires:</i> '+esc(role.requirements)+'</div>':'')+warn+people+'</div>'+
      '<div class="tm">'+tm(sl.call||s.start)+'–'+tm(sl.release||s.end)+'</div><div class="op">'+fill+'</div><div>'+payText(sl.pay)+'</div><div class="act">'+act+'</div></div>';
  }

  // ---------- My schedule ----------
  function vMine(){
    var d=S.data, rs=d.requests, out='<h2>My schedule</h2><p class="sub">Pending and waitlist requests can be released anytime. Dropping an approved slot needs ResQ\'s OK.</p>';
    var groups={ Upcoming:rs.filter(function(r){return !r.past && ['Pending','Approved','Waitlist','Drop requested'].indexOf(r.status)>=0;}),
      Past:rs.filter(function(r){return r.past && r.status==='Approved';}),
      Closed:rs.filter(function(r){return ['Declined','Dropped'].indexOf(r.status)>=0 || (r.past && r.status!=='Approved');}) };
    out+='<div class="toolbar">'+chips('mineFilter',[['Upcoming','Upcoming ('+groups.Upcoming.length+')'],['Past','Past ('+groups.Past.length+')'],['Closed','Declined / dropped ('+groups.Closed.length+')']],S.mineFilter)+'</div>';
    var list=groups[S.mineFilter]||[];

        '<td><button class="btn ghost small" data-act="saveSlot" data-id="'+esc(sl.id)+'" data-k="'+sk+'">Save</button></td></tr>';
    });
    h+='<tr><td><select class="ed" id="ns-role-'+k+'">'+roles.map(function(r){return '<option>'+esc(r.name)+'</option>';}).join('')+'</select></td><td><input class="ed" id="ns-open-'+k+'" type="number" min="1" value="1" style="width:64px"></td>'+
      '<td><input class="ed" id="ns-pay-'+k+'" type="number" min="0" step="5" value="0" style="width:80px"></td><td><input class="ed" id="ns-call-'+k+'" type="text" value="'+esc(s.start)+'" style="width:62px"></td><td><input class="ed" id="ns-rel-'+k+'" type="text" value="'+esc(s.end)+'" style="width:62px"></td>'+
      '<td><input class="ed" id="ns-notes-'+k+'" type="text" placeholder="Notes for this role"></td><td></td><td><button class="btn small" data-act="addSlot" data-id="'+esc(id)+'" data-k="'+k+'">Add slot</button></td></tr>';
    h+='</tbody></table></div></div></details>';
    return h;
  }

  // ---------- Admin: payments ----------
  function vPayments(){
    var a=S.data.admin, out='<h2>Payments</h2><p class="sub">Approved slots and what\'s owed. "Owed" means the block has happened and it isn\'t marked paid yet.</p>';
    var courses=['All'].concat(S.data.courses.map(function(c){return c.id;}));
    var base=a.requests.filter(function(r){ return r.status==='Approved' && (S.payCourse==='All'||r.courseId===S.payCourse); });
    var list=base.filter(function(r){ return S.payFilter==='All' || r.pay===S.payFilter; });
    var tot={Owed:0,Upcoming:0,Paid:0}; base.forEach(function(r){ tot[r.pay]=(tot[r.pay]||0)+r.amount; });
    out+='<div class="grid g4" style="margin-bottom:16px"><div class="stat accent"><div class="n">'+money(tot.Owed)+'</div><div class="l">Owed now</div></div><div class="stat"><div class="n">'+money(tot.Upcoming)+'</div><div class="l">Upcoming (approved)</div></div><div class="stat"><div class="n">'+money(tot.Paid)+'</div><div class="l">Paid</div></div><div class="stat"><div class="n">'+base.length+'</div><div class="l">Approved slots</div></div></div>';
    out+='<div class="toolbar">'+chips('payFilter',['Owed','Upcoming','Paid','All'],S.payFilter)+chips('payCourse',courses.map(function(c){ var x=S.data.courses.filter(function(y){return y.id===c;})[0]; return [c, x?x.name.replace('Accelerated EMT — ','EMT '):'All courses']; }),S.payCourse)+
      '<button class="btn ghost small" data-act="csv">Export CSV</button></div>';
    out+= list.length ? '<div class="card tbl-wrap"><table><thead><tr><th>Date</th><th>Instructor</th><th>Slot</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>'+list.map(function(r){
      var k=r.id.replace(/[^A-Za-z0-9]/g,'');
      return '<tr><td>'+esc(r.dateText)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.role)+' · Day '+esc(r.day)+' '+esc(r.block)+'<div class="small muted">'+esc(r.course.replace('Accelerated EMT — ',''))+'</div></td>'+
        '<td><input class="ed" id="amt-'+k+'" type="number" min="0" step="5" value="'+esc(r.amount)+'" style="width:90px"'+(r.paid?' disabled':'')+'>'+(r.amountSet&&!r.paid?'<div class="small muted">custom</div>':'')+'</td>'+
        '<td>'+pill(r.pay)+(r.paidOn?' <span class="small muted">'+esc(r.paidOn)+'</span>':'')+'</td><td class="row-tools">'+
        (r.paid?'<button class="btn ghost small" data-act="req" data-op="unpaid" data-id="'+esc(r.id)+'">Undo paid</button>':'<button class="btn small" data-act="paid" data-id="'+esc(r.id)+'" data-k="'+k+'">Mark paid</button><button class="btn ghost small" data-act="amount" data-id="'+esc(r.id)+'" data-k="'+k+'">Save amount</button>')+'</td></tr>';
    }).join('')+'</tbody></table></div>' : '<div class="card"><p class="empty">Nothing here.</p></div>';
    var per={}; base.forEach(function(r){ var p=per[r.email]=per[r.email]||{name:r.name,n:0,Owed:0,Upcoming:0,Paid:0}; p.n++; p[r.pay]+=r.amount; });
    var rows=Object.keys(per).map(function(k){return per[k];}).sort(function(x,y){return y.Owed-x.Owed || x.name.localeCompare(y.name);});
    if(rows.length) out+='<div class="card tbl-wrap"><h3>By instructor</h3><table><thead><tr><th>Instructor</th><th>Slots</th><th>Owed</th><th>Upcoming</th><th>Paid</th></tr></thead><tbody>'+rows.map(function(p){ return '<tr><td>'+esc(p.name)+'</td><td>'+p.n+'</td><td><b>'+money(p.Owed)+'</b></td><td>'+money(p.Upcoming)+'</td><td>'+money(p.Paid)+'</td></tr>'; }).join('')+'</tbody></table></div>';
    return out;
  }

  // ---------- Admin: settings ----------
  function vSettings(){
    var a=S.data.admin, set={}; a.settings.forEach(function(s){ set[s.key]=s.value; });
    var toggles=[['Email admins: new instructor signup','When someone creates an account'],['Email admins: new slot request','When someone requests or waitlists for a slot'],['Email admins: drop request','When someone asks to drop an approved slot'],
      ['Email instructor: account approved or declined','Account approved, declined or made inactive'],['Email instructor: slot status change','Slot held, approved, declined, waitlisted, moved up or dropped'],
      ['Email instructor: session reminder','Reminder before each approved slot'],['Email instructor: marked paid','When you mark a slot paid']];
    var out='<h2>Settings</h2><p class="sub">Email alerts and roles. Login-code emails always send.</p><div class="grid g2"><div class="card"><h3>Emails</h3>';
    out+=toggles.map(function(t,i){ var v=set[t[0]]; var isOn = v===undefined || v==='' || !/^(off|no|false|0)$/i.test(String(v));
      return '<label class="switch"><input type="checkbox" class="set-t" data-key="'+esc(t[0])+'"'+(isOn?' checked':'')+'><span><b>'+esc(t[0].replace(/^Email (admins|instructor): /,''))+'</b> <span class="small muted">'+(t[0].indexOf('admins')>0?'to admins':'to instructor')+'</span><div class="d">'+esc(t[1])+'</div></span></label>'; }).join('');
    out+='<div class="form-grid" style="margin-top:10px"><div><label>Reminder days before session</label><input id="set-days" type="number" min="0" max="30" value="'+esc(set['Reminder days before session']||3)+'"></div>'+
      '<div class="full"><label>Admin alert emails (comma-separated; blank = everyone on the admin list)</label><input id="set-admins" type="text" value="'+esc(set['Admin alert emails']||'')+'"></div></div>'+
      '<div style="margin-top:12px"><button class="btn" data-act="saveSettings">Save email settings</button></div></div>';
    out+='<div class="card"><h3>Roles</h3><p class="small muted">"Open to all" roles can be filled by any approved account without clearing them first (good for Patient).</p>';
    out+=S.data.config.roles.map(function(r,i){ return '<div class="ins-card"><div class="ins-top"><b>'+esc(r.name)+'</b>'+(r.active?'':pill('Inactive'))+'</div>'+
      '<div style="margin-top:6px"><label>Description</label><input class="ed" id="ro-desc-'+i+'" value="'+esc(r.description)+'"></div><div style="margin-top:6px"><label>Requirements (shown on every slot)</label><input class="ed" id="ro-req-'+i+'" value="'+esc(r.requirements)+'"></div>'+
      '<div class="row-tools" style="margin-top:8px"><label class="small" style="display:flex;gap:6px;margin:0"><input type="checkbox" id="ro-open-'+i+'"'+(r.openToAll?' checked':'')+'> Open to all approved</label><label class="small" style="display:flex;gap:6px;margin:0"><input type="checkbox" id="ro-act-'+i+'"'+(r.active?' checked':'')+'> Active</label>'+
      '<button class="btn ghost small" data-act="saveRole" data-i="'+i+'">Save</button></div></div>'; }).join('');
    out+='<div class="ins-card"><b>Add a role</b><div class="form-grid" style="margin-top:6px"><div><label>Name</label><input id="nr-name" type="text"></div><div><label>Requirements</label><input id="nr-req" type="text"></div><div class="full"><label>Description</label><input id="nr-desc" type="text"></div></div>'+
      '<div style="margin-top:8px"><button class="btn small" data-act="addRole">Add role</button></div></div></div></div>';
    out+='<p class="note">Everything lives in the <a href="'+esc(a.sheetUrl)+'" target="_blank" rel="noopener">Instructor Portal sheet</a>. You can edit it directly; don\'t rename the column headers.</p>';
    return out;
  }

  // ---------- actions ----------
  function run(btn, p, okMsg, after){
    busy(btn,true);
    return p.then(function(r){ if(okMsg) toast(typeof okMsg==='function'?okMsg(r):okMsg); if(after) after(r); return refresh(); })
      .catch(function(e){ toast(e.message); busy(btn,false); });
  }
  function ics(r){
    var d=r.date.replace(/-/g,''), z=function(t){ return (t||'0000').padStart(4,'0')+'00'; };
    var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ResQ Education//Instructor Portal//EN','BEGIN:VEVENT','UID:'+r.id+'@instructors.resqedu.com',
      'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART;TZID=America/Chicago:'+d+'T'+z(r.call),'DTEND;TZID=America/Chicago:'+d+'T'+z(r.release),
      'SUMMARY:ResQ '+r.role+' - '+r.course.replace('Accelerated EMT — ','EMT ')+' Day '+r.day,'LOCATION:'+(r.location||''),'DESCRIPTION:'+((r.topic||'')+(r.notes?' | '+r.notes:'')).replace(/[,;]/g,' '),'END:VEVENT','END:VCALENDAR'];
    var blob=new Blob([lines.join('\r\n')],{type:'text/calendar'}), a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='resq-'+r.date+'-'+r.block+'.ics'; document.body.appendChild(a); a.click(); a.remove();
  }
  function csv(){
    var a=S.data.admin, rows=[['Date','Instructor','Email','Course','Day','Block','Role','Call','Release','Amount','Status','Paid on']];
    a.requests.filter(function(r){ return r.status==='Approved' && (S.payCourse==='All'||r.courseId===S.payCourse) && (S.payFilter==='All'||r.pay===S.payFilter); })
      .forEach(function(r){ rows.push([r.date,r.name,r.email,r.course,r.day,r.block,r.role,r.call,r.release,r.amount,r.pay,r.paidOn]); });
    var text=rows.map(function(r){ return r.map(function(c){ c=String(c==null?'':c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(','); }).join('\n');
    var blob=new Blob([text],{type:'text/csv'}), el=document.createElement('a'); el.href=URL.createObjectURL(blob); el.download='resq-instructor-pay-'+S.payFilter.toLowerCase()+'.csv'; document.body.appendChild(el); el.click(); el.remove();
  }

  document.addEventListener('click', function(ev){
    var b=ev.target.closest('[data-act]'); if(!b) return;
    var act=b.dataset.act, id=b.dataset.id, k=b.dataset.k;
    if(b.tagName==='INPUT') return;
    if(act==='tab'){ S.tab=b.dataset.v; S.dropFor=null; render(); window.scrollTo(0,0); return; }
    if(act==='chip'){ S[b.dataset.k]=b.dataset.v; render(); return; }
    if(act==='retry'){ start(); return; }
    if(act==='gomine'){ S.tab='mine'; S.mineFilter='Upcoming'; render(); window.scrollTo(0,0); return; }
    if(act==='request') return run(b, authed('apiRequestSlot',id,''), function(r){ return r.status==='Waitlist'?'You\'re #'+r.position+' on the waitlist':'Held for you. Pending approval.'; });
    if(act==='dropAsk'){ S.dropFor=id; render(); var e=$('drop-reason'); if(e) e.focus(); return; }
    if(act==='dropCancel'){ S.dropFor=null; render(); return; }
    if(act==='drop'){ var reason=val('drop-reason'); S.dropFor=null; return run(b, authed('apiDrop',id,reason), function(r){ return r.status==='Dropped'?'Released':r.status==='Approved'?'You\'re keeping the slot':'Drop request sent to ResQ'; }); }
    if(act==='ics'){ var r=S.data.requests.filter(function(x){return x.id===id;})[0]; if(r) ics(r); return; }
    if(act==='saveProfile') return run(b, authed('apiUpdateProfile',{name:val('pf-name'),phone:val('pf-phone'),about:val('pf-about'),credentials:checked('pf-cred')}),'Saved');
    if(act==='upload'){
      var f=$('up-file').files[0]; if(!val('up-cred')){ toast('Pick which certification this is.'); return; } if(!f){ toast('Pick a file first.'); return; }
      if(f.size>4*1024*1024){ toast('That file is over 4 MB. Try a smaller photo or PDF.'); return; }
      var fr=new FileReader(); busy(b,true,'Uploading…');
      fr.onload=function(){ busy(b,false); run(b, authed('apiUploadCert',{credential:val('up-cred'),expires:val('up-exp'),fileName:f.name,mime:f.type||'application/pdf',data:fr.result}),'Uploaded'); };
      fr.readAsDataURL(f); return;
    }
    // admin
    if(act==='req') return run(b, authed('apiAdminRequest',id,b.dataset.op), {approve:'Approved',decline:'Declined',approveDrop:'Drop approved',denyDrop:'Kept on the schedule',unpaid:'Marked unpaid'}[b.dataset.op]);
    if(act==='clearRole'){
      var ins=S.data.admin.instructors.filter(function(i){return i.email===b.dataset.email;})[0];
      return run(b, authed('apiAdminInstructor',b.dataset.email,{roles:ins.roles.concat([b.dataset.role])}).then(function(){ return authed('apiAdminRequest',id,'approve'); }),'Role cleared and slot approved');
    }
    if(act==='ins'){
      var ch={roles:checked(b.dataset.cls)}; var n=$('note-'+b.dataset.cls); if(n) ch.notes=n.value;
      if(b.dataset.op!=='save') ch.status=b.dataset.op;
      return run(b, authed('apiAdminInstructor',b.dataset.email,ch), b.dataset.op==='save'?'Saved':'Account '+b.dataset.op.toLowerCase());
    }
    if(act==='saveCourse'){
      var c={name:val('cf-name'),start:val('cf-start'),end:val('cf-end'),location:val('cf-loc'),students:val('cf-stu'),status:val('cf-status'),description:val('cf-desc')}; if(id) c.id=id;
      return run(b, authed('apiAdminSaveCourse',c), id?'Course saved':'Course created', function(r){ S.bCourse=r.id; });
    }
    if(act==='bulkPay') return run(b, authed('apiAdminBulkPay',S.bCourse,val('bp-role'),val('bp-block'),val('bp-pay')), function(r){ return 'Pay set on '+r.updated+' slots'; });
    if(act==='copyCourse') return run(b, authed('apiAdminCopyCourse',S.bCourse,val('cp-name'),val('cp-start')), function(r){ return 'Copied '+r.sessions+' blocks and '+r.slots+' slots'; }, function(r){ S.bCourse=r.id; });
    if(act==='addSess') return run(b, authed('apiAdminSaveSession',{courseId:S.bCourse,day:val('ns-day'),date:val('ns-date'),block:val('ns-block'),start:val('ns-start'),end:val('ns-end'),topic:val('ns-topic')}),'Block added', function(r){ S.openSess[r.id]=true; });
    if(act==='saveSess') return run(b, authed('apiAdminSaveSession',{id:id,day:val('se-day-'+k),date:val('se-date-'+k),block:val('se-block-'+k),start:val('se-start-'+k),end:val('se-end-'+k),topic:val('se-topic-'+k),status:val('se-status-'+k)}),'Block saved');
    if(act==='saveSlot') return run(b, authed('apiAdminSaveSlot',{id:id,openings:val('sl-open-'+k),pay:val('sl-pay-'+k),call:val('sl-call-'+k),release:val('sl-rel-'+k),notes:val('sl-notes-'+k),status:val('sl-status-'+k)}),'Slot saved');
    if(act==='addSlot') return run(b, authed('apiAdminSaveSlot',{sessionId:id,role:val('ns-role-'+k),openings:val('ns-open-'+k),pay:val('ns-pay-'+k),call:val('ns-call-'+k),release:val('ns-rel-'+k),notes:val('ns-notes-'+k)}),'Slot added');
    if(act==='assignOpen'){ S.assignFor=id; render(); return; }
    if(act==='assign'){ S.assignFor=null; return run(b, authed('apiAdminAssign',id,val('as-'+k)),'Assigned and approved'); }
    if(act==='paid') return run(b, authed('apiAdminRequest',id,'paid',val('amt-'+k)),'Marked paid');
    if(act==='amount') return run(b, authed('apiAdminRequest',id,'amount',val('amt-'+k)),'Amount saved');
    if(act==='csv'){ csv(); return; }
    if(act==='saveSettings'){
      var ch2={}; Array.prototype.forEach.call(document.querySelectorAll('.set-t'),function(e){ ch2[e.dataset.key]=e.checked; });
      ch2['Reminder days before session']=val('set-days'); ch2['Admin alert emails']=val('set-admins');
      return run(b, authed('apiAdminSettings',ch2),'Settings saved');
    }
    if(act==='saveRole'){ var i=b.dataset.i, r2=S.data.config.roles[i];
      return run(b, authed('apiAdminSaveRole',{original:r2.name,description:val('ro-desc-'+i),requirements:val('ro-req-'+i),openToAll:$('ro-open-'+i).checked,active:$('ro-act-'+i).checked}),'Role saved'); }
    if(act==='addRole') return run(b, authed('apiAdminSaveRole',{name:val('nr-name'),requirements:val('nr-req'),description:val('nr-desc')}),'Role added');
  });
  document.addEventListener('change', function(ev){
    var t=ev.target;
    if(t.dataset && t.dataset.act==='onlyOpen'){ S.onlyOpen=t.checked; render(); }
  });
  document.addEventListener('toggle', function(ev){
    var d=ev.target; if(d.dataset && d.dataset.sess) S.openSess[d.dataset.sess]=d.open;
  }, true);
  document.addEventListener('input', function(ev){
    if(ev.target.id==='ins-search'){ S.insSearch=ev.target.value; var pos=ev.target.selectionStart; render(); var e=$('ins-search'); if(e){ e.focus(); e.setSelectionRange(pos,pos); } }
  });

  $('su-creds').innerHTML = credChecks('su-cred',[]);
  $('form-email').addEventListener('submit', sendCode);
  $('form-signup').addEventListener('submit', signup);
  $('form-code').addEventListener('submit', verify);
  $('btn-show-signup').addEventListener('click', function(){ $('su-email').value=$('email').value; setMsg(''); step('signup'); });
  $('btn-signup-back').addEventListener('click', function(){ setMsg(''); step('email'); });
  $('btn-back').addEventListener('click', function(){ setMsg(''); step('email'); });
  $('btn-resend').addEventListener('click', function(){ $('email').value=pendingEmail; step('email'); sendCode(); });
  $('btn-logout').addEventListener('click', function(){ setToken(null); S.data=null; showLogin(''); });
  window.__portalLogin = function(t){ setToken(t); S.tab='slots'; S.dropFor=null; S.assignFor=null; start(); };
  window.__portalStart = function(){ if(getToken()) start(); else showLogin(''); };
  if(!window.__DEMO_API) window.__portalStart();
})();
</script>
</body>
